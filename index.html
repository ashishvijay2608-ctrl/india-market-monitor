
<!-- MOTIVATIONAL TRADING THEME -->
<style>
:root {
  --bg: #070b16;
  --card: rgba(17, 27, 48, 0.92);
  --line: rgba(100, 160, 255, 0.22);
  --text: #f2f6ff;
  --muted: #9aacc8;
  --green: #32f5a0;
  --red: #ff536d;
  --gold: #ffd166;
  --blue: #59a5ff;
}

/* Premium dark background with glowing lights */
html {
  min-height: 100%;
  background: #070b16;
}
body {
  min-height: 100vh;
  color: var(--text) !important;
  background:
    radial-gradient(ellipse at 10% 5%,
      rgba(35, 100, 220, 0.24), transparent 38%),
    radial-gradient(ellipse at 90% 25%,
      rgba(0, 220, 150, 0.10), transparent 35%),
    radial-gradient(ellipse at 50% 95%,
      rgba(125, 65, 230, 0.13), transparent 40%),
    linear-gradient(145deg, #070b16, #0b1426 55%, #080d19) !important;
  background-attachment: fixed !important;
}

/* Give cards a professional glass effect */
.card, .risk-panel, section, article {
  background: linear-gradient(
    145deg,
    rgba(22, 35, 59, 0.96),
    rgba(10, 18, 33, 0.96)
  ) !important;
  border: 1px solid var(--line) !important;
  border-radius: 17px !important;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.20);
}

h1, h2, h3 {
  color: #f5f8ff;
  letter-spacing: 0.2px;
}

button {
  transition: transform .18s ease, filter .18s ease;
}
button:active {
  transform: scale(.98);
}
button:hover {
  filter: brightness(1.12);
}

/* Motivational hero panel */
.motivation-hero {
  position: relative;
  overflow: hidden;
  margin: 18px auto;
  padding: 25px 20px;
  border-radius: 20px;
  border: 1px solid rgba(255, 209, 102, .36);
  background:
    radial-gradient(ellipse at 100% 0%,
      rgba(255, 209, 102, .18), transparent 45%),
    linear-gradient(125deg, #13213a, #101629 65%, #15243a);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
}
.motivation-hero .eyebrow {
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
}
.motivation-hero h2 {
  font-size: clamp(23px, 5vw, 36px);
  line-height: 1.18;
  margin: 13px 0;
}
.motivation-hero h2 span {
  color: var(--gold);
}
.motivation-hero p {
  color: #b5c4da;
  line-height: 1.7;
  font-size: 14px;
  max-width: 600px;
}
.motivation-hero .motto {
  display: inline-block;
  color: var(--green);
  border: 1px solid rgba(50, 245, 160, .3);
  background: rgba(50, 245, 160, .07);
  border-radius: 30px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: bold;
}

/* Small accent for risk readings */
.risk-green, .green {
  color: var(--green) !important;
}
.risk-red, .red {
  color: var(--red) !important;
}
.risk-yellow, .gold {
  color: var(--gold) !important;
}

/* Smooth background details */
.motivation-hero::after {
  content: "₹";
  position: absolute;
  right: 17px;
  bottom: -42px;
  font-size: 160px;
  font-weight: 900;
  color: rgba(255, 209, 102, .045);
  pointer-events: none;
}
@media (max-width: 480px) {
  .motivation-hero { padding: 20px 16px; }
}
</style>

<!-- MOTIVATIONAL BANNER -->
<div class="motivation-hero">
  <div class="eyebrow">DISCIPLINE · PATIENCE · CONSISTENCY</div>
  <h2>Trade the plan.<br><span>Protect your capital.</span></h2>
  <p>
    Har din profit banana zaroori nahi.
    Har din discipline follow karna zaroori hai.
    Pehle risk samjho, phir trade lo.
  </p>
  <div class="motto">⚡ PROCESS OVER EMOTION</div>
</div>
<!-- END MOTIVATIONAL THEME -->
